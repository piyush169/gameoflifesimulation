<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoL Chaos Engine Telemetry</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <h1 style="text-align: center; font-size: 2.5em; margin-bottom: 20px; color: #58a6ff; font-family: monospace;">DISTRIBUTED GAME OF LIFE CHAOS SIMULATOR</h1>
        <header>
            <h1>CLUSTER STATE: <span id="status" class="status-connecting">CONNECTING...</span></h1>
            <div class="metrics">
                <div class="metric-box">
                    <span class="label">ENGINE TICK RATE</span>
                    <span class="value"><span id="fps">0.0</span> /s</span>
                </div>
                <div class="metric-box">
                    <span class="label">GRID POPULATION</span>
                    <span class="value" id="population">0</span>
                </div>
            </div>
        </header>
        
        <main>
            <canvas id="golCanvas" width="500" height="500"></canvas>
            
            <div class="controls" style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="resetBtn" style="padding: 10px 20px; background: #3fb950; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">RESET GRID</button>
                <button id="chaosBtn" style="padding: 10px 20px; background: #f85149; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">INITIATE CHAOS SPIKE</button>
            </div>

            <div class="graphs" style="margin-top: 20px; display: flex; gap: 20px; height: 350px;">
                <div style="flex: 1; background: #0d1117; padding: 10px; border: 1px solid #30363d; border-radius: 6px;">
                    <canvas id="cpuChart"></canvas>
                </div>
                <div style="flex: 1; background: #0d1117; padding: 10px; border: 1px solid #30363d; border-radius: 6px;">
                    <canvas id="queueChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
